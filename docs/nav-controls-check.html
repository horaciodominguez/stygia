<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>nav controls check</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    body { background: #121212; color: #c8c8c8; padding: 24px; font: 13px/1.4 "FiraCode Nerd Font Propo", monospace; }
    #pma_navigation { width: 260px; background: #1a1a1a; padding: 8px 0; border: 1px solid #333; }
    .tree-row { display: flex; align-items: center; gap: 6px; padding: 2px 10px; }
    .pair { display: flex; gap: 32px; margin-top: 28px; align-items: end; }
    .pair figure { margin: 0; text-align: center; }
    .pair .icon { width: 48px; height: 48px; min-width: 48px; min-height: 48px; color: #c8c8c8; }
    .pair figcaption { margin-top: 8px; color: #949494; font-size: 12px; }
  </style>
</head>
<body>
  <div id="pma_navigation">
    <div id="pma_navigation_tree" class="synced">
      <div id="navigation_controls_outer">
        <div id="navigation_controls">
          <a id="pma_navigation_collapse" href="#" title="Collapse all">
            <img src="../img/dot.gif" class="icon ic_s_collapseall" alt="">
          </a>
          <a id="pma_navigation_sync" href="#" title="Unlink from main panel">
            <img id="sync-icon" src="../img/dot.gif" class="icon ic_s_link" alt="">
          </a>
        </div>
      </div>
      <div class="tree-row"><img src="../img/dot.gif" class="icon ic_b_browse" alt=""><span>tabla de referencia</span></div>
    </div>
  </div>

  <div class="pair">
    <figure>
      <img src="../img/dot.gif" class="icon ic_s_link" alt="">
      <figcaption>ic_s_link (reposo synced)</figcaption>
    </figure>
    <figure>
      <img src="../img/dot.gif" class="icon ic_s_unlink" alt="">
      <figcaption>ic_s_unlink (hover / unsynced class)</figcaption>
    </figure>
  </div>
  <p style="margin-top:16px;color:#8d8d8d">Ambos deben verse idénticos: el hover de PMA solo cambia la clase; el estado unsynced se marca con el borde verde del control.</p>
  <script>
    // Mimic phpMyAdmin main.js: swap classes on hover over #pma_navigation_sync
    const tree = document.getElementById('pma_navigation_tree');
    const sync = document.getElementById('pma_navigation_sync');
    const img = document.getElementById('sync-icon');
    sync.addEventListener('mouseenter', () => {
      const synced = tree.classList.contains('synced');
      if (synced) { img.classList.replace('ic_s_link', 'ic_s_unlink'); }
      else { img.classList.replace('ic_s_unlink', 'ic_s_link'); }
    });
    sync.addEventListener('mouseleave', () => {
      const synced = tree.classList.contains('synced');
      if (synced) { img.classList.replace('ic_s_unlink', 'ic_s_link'); }
      else { img.classList.replace('ic_s_link', 'ic_s_unlink'); }
    });
  </script>
</body>
</html>
