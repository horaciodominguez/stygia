name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile theme
        run: npm run build

      - name: Package zip
        run: |
          mkdir -p dist/stygia
          cp -r css img fonts scss docs theme.json screen.png README.md LICENSE CHANGELOG.md package.json dist/stygia/
          (cd dist && zip -r ../stygia.zip stygia)

      - uses: actions/upload-artifact@v4
        with:
          name: stygia-theme
          path: stygia.zip

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: stygia.zip
